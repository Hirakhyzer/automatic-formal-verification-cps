name: Bootstrap research tree

on:
  push:
    paths:
      - bootstrap_repo.py
      - .bootstrap_payload/**
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bootstrap_repo.py
